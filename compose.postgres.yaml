services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skin_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-skin_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # 避免与开发机上常驻的 PostgreSQL 默认 5432 端口冲突；容器服务间仍使用 5432。
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - skin-assistant-postgres:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # 容器内 localhost 指向 app 自身；必须显式使用 postgres 服务名连接共享数据库。
      DATABASE_URL: ${DATABASE_URL_DOCKER:?set DATABASE_URL_DOCKER}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # 商品图属于业务数据；容器更新不能使数据库中的图片关联变成失效链接。
      - skin-assistant-product-uploads:/app/data/runtime/uploads/products
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  skin-assistant-postgres:
  skin-assistant-product-uploads:
